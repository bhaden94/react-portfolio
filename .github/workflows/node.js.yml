name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets you republish after editing content in Sanity, without a code change.
  workflow_dispatch:
  # Picks up Sanity edits automatically once a day.
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gh-pages authenticates via the URL below; the checkout credential
          # helper would otherwise override it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Captures the current Sanity content, then type-checks and bundles.
      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7

      # Never deploy from a pull request.
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          # Falls back to GITHUB_TOKEN, which needs Settings > Actions >
          # Workflow permissions set to "Read and write".
          DEPLOY_TOKEN: ${{ secrets.ACTIONS_DEPLOY_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages -d build \
            -u "github-actions[bot] <github-actions[bot]@users.noreply.github.com>" \
            -r "https://x-access-token:${DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
