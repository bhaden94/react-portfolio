name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you refresh the build-time content snapshot after editing in Sanity.
  # Not needed for edits to reach visitors — the site reads Sanity on every load.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gh-pages authenticates via the URL below; the checkout credential
          # helper would otherwise override it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Captures the current Sanity content, then type-checks and bundles.
      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7

      # Never deploy from a pull request.
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          # The repo's old ACTIONS_DEPLOY_ACCESS_TOKEN PAT is expired, so use the
          # built-in token. Requires Settings > Actions > General > Workflow
          # permissions set to "Read and write permissions".
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh-pages' -u parser rejects the brackets in "github-actions[bot]",
          # so set the commit identity through git config instead.
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npx gh-pages -d build \
            -r "https://x-access-token:${DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
